# Cloudflare Worker config for the Fade license system.
#
# This worker mints Ed25519-signed JWTs that the Fade Playground verifies
# against the public key (LICENSE_PUBLIC_KEY below). It holds NO user data —
# every key is derived deterministically from (email, version), so there's
# nothing to store.
#
# Secrets (LICENSE_PRIVATE_KEY, STRIPE_*, RESEND_*, ADMIN_API_KEY) are set via
# `wrangler secret put`, NOT in this file. See README.md for deploy steps.
# Generate the keypair with: node scripts/generate-keys.mjs

name = "fade-license"
main = "src/index.ts"
compatibility_date = "2025-01-01"

# `workers.dev` subdomain is the free-tier default — no custom domain
# needed for this to work.
workers_dev = true

# Non-secret configuration. LICENSE_PRIVATE_KEY and the API keys are NOT here;
# set them with `wrangler secret put`. LICENSE_PUBLIC_KEY is public — it's the
# verify-only half of the Ed25519 pair (an Ed25519 JWK, JSON) and is exposed
# via GET /public-key.
[vars]
# Ed25519 JWK — the public half of the pair whose PRIVATE half must be set as
# the LICENSE_PRIVATE_KEY secret. Generate a fresh pair (and keep these halves
# in sync) with: node scripts/generate-keys.mjs
LICENSE_PUBLIC_KEY = "{\"kty\":\"OKP\",\"crv\":\"Ed25519\",\"x\":\"Jpy419I82v_t705OVdcUf0oOrad1wbRjF4_h3hd2-Cc\",\"alg\":\"EdDSA\"}"
UUID_NAMESPACE = "fade-licenses"
FROM_EMAIL = "keys@brewed.ink"
FROM_NAME = "Fade"
EMAIL_SUBJECT = "Your Fade license"
PLAYGROUND_URL = "https://playground.fadebasic.com"
# Resend published template alias that carries the {{{KEY}}} variable.
RESEND_TEMPLATE_ALIAS = "fade-purchase"
# Your inbox — gets a BCC copy of every key email.
OWNER_EMAIL = "chris@brewed.ink"
