# Manual production release of the Playground. Trigger from the Actions tab
# (Actions → "Deploy (production)" → Run workflow, enter a version).
#
# 1. Builds + deploys to the production Pages branch.
# 2. On success, tags vX.Y.Z and creates a GitHub Release whose notes are the
#    matching `## [X.Y.Z]` section of CHANGELOG.md (same mechanism as fade's
#    dby release). Add that section to CHANGELOG.md before releasing.
name: Deploy (production)

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, e.g. 1.2.0 (must have a matching ## [x.y.z] in CHANGELOG.md)"
        required: true

run-name: Release Playground v${{ inputs.version }} by @${{ github.actor }}

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      branch: main   # production branch → production deployment
    secrets: inherit

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Tag + GitHub Release from CHANGELOG.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          # Extract the section between "## [$VERSION]" and the next "## [" .
          # Pass VERSION via env (not ${{ }} interpolation) to avoid injection.
          NOTES=$(awk -v v="$VERSION" '
            $0 ~ ("^## \\[" v "\\]") { f=1; next }
            f && /^## \[/ { exit }
            f { print }
          ' CHANGELOG.md | sed '/./,$!d')   # trim leading blank lines

          if [ -z "$NOTES" ]; then
            echo "::error::No '## [$VERSION]' section found in CHANGELOG.md"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$VERSION"
          git push origin "v$VERSION"

          printf '%s\n' "$NOTES" | gh release create "v$VERSION" \
            --title "v$VERSION" \
            --notes-file -
