# Manual production release of the Playground. Trigger from the Actions tab
# (Actions → "Deploy (production)" → Run workflow).
#
# 1. Builds + deploys to the production Pages branch.
# 2. On success, reads the CURRENT version + notes from the top entry of
#    Playground/src/changelog.ts (the single source of truth — same file that
#    drives the in-app version popup), tags vX.Y.Z, and creates a GitHub Release
#    with those notes.
#
# To cut a release: prepend a new entry to src/changelog.ts, then run this.
name: Deploy (production)

on:
  workflow_dispatch:

run-name: Release Playground (production) by @${{ github.actor }}

jobs:
  deploy:
    uses: ./.github/workflows/_deploy-pages.yml
    with:
      branch: main   # production branch → production deployment
    secrets: inherit

  release:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Tag + GitHub Release from changelog.ts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          V=$(npx -y tsx Playground/scripts/changelog-notes.ts --version)
          npx -y tsx Playground/scripts/changelog-notes.ts > "$RUNNER_TEMP/notes.md"
          echo "Releasing v$V"
          cat "$RUNNER_TEMP/notes.md"

          if git rev-parse "v$V" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "v$V" >/dev/null 2>&1; then
            echo "::error::Tag v$V already exists — bump the top entry of src/changelog.ts before releasing."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "v$V"
          git push origin "v$V"
          gh release create "v$V" --title "v$V" --notes-file "$RUNNER_TEMP/notes.md"
